name: VIIPER Build Base

on:
    workflow_call:
        inputs:
            artifact_suffix:
                required: false
                type: string
                default: ""
                description: "Suffix to add to artifact names"
            upload_artifacts:
                required: false
                type: boolean
                default: false
                description: "Whether to upload build artifacts"

env:
    GOFLAGS: -mod=readonly
    GOTOOLCHAIN: local
    VIIPER_NATIVE_SOURCE_REVISION: ${{ github.sha }}

jobs:
    test:
        name: Test
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
              with:
                  just-version: "1.58.0"

            - name: Show Go version
              run: go version

            - name: Validate Windows installer first-run contract
              shell: pwsh
              run: |
                  $tokens = $null
                  $errors = $null
                  [Management.Automation.Language.Parser]::ParseFile(
                      (Resolve-Path "scripts/install.ps1"),
                      [ref]$tokens, [ref]$errors) | Out-Null
                  if ($errors.Count -ne 0) {
                      $errors | Format-List
                      throw "scripts/install.ps1 has PowerShell parser errors."
                  }
                  $source = Get-Content "scripts/install.ps1" -Raw
                  if ($source -match '(?m)^\s*\$runValue\s*=\s*Get-ItemPropertyValue') {
                      throw "VIIPER Run-value reads must tolerate a missing first-run property."
                  }
                  if ([regex]::Matches($source,
                          '(?m)^\s*\$runValue\s*=\s*Get-ViiperRunValue\s*$').Count -ne 2 -or
                      $source -notmatch 'RegistryValueOptions\]::DoNotExpandEnvironmentNames') {
                      throw "Both VIIPER startup verification paths must use the safe registry helper."
                  }
                  if ($source -notmatch 'function Get-OptionalRegistryValue' -or
                      $source -notmatch '\$null -eq \$key\) \{ return \$null \}') {
                      throw "The optional registry helper must treat a missing key as clean first-run state."
                  }
                  if ($source -notmatch 'VIIPER_DEVELOPER_STANDALONE' -or
                      $source -notmatch 'Global\\DS4Windows-VIIPER-Setup') {
                      throw "Windows standalone setup must be explicit and share the managed infrastructure mutex."
                  }

            - name: Lint
              uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
              with:
                  version: v2.12.2
                  install-mode: goinstall

            - name: Run tests
              run: just test-coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  directory: .
                  fail_ci_if_error: false

    build:
        name: Build binaries (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
        runs-on: ${{ matrix.target.runner }}
        needs: test
        strategy:
            fail-fast: false
            matrix:
                target:
                    - { goos: linux, goarch: amd64, ext: "", runner: ubuntu-24.04 }
                    - { goos: linux, goarch: arm64, ext: "", runner: ubuntu-24.04 }
                    - { goos: windows, goarch: amd64, ext: ".exe", runner: windows-2025 }
                    - { goos: windows, goarch: arm64, ext: ".exe", runner: windows-2025 }
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Exercise Windows installer first-run registry states
              if: ${{ matrix.target.goos == 'windows' && matrix.target.goarch == 'amd64' }}
              shell: pwsh
              run: ./scripts/test-install-first-run.ps1

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
              with:
                  just-version: "1.58.0"

            - name: Install goversioninfo
              shell: pwsh
              run: |
                  go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

            - name: Build
              env:
                  GOOS: ${{ matrix.target.goos }}
                  GOARCH: ${{ matrix.target.goarch }}
                  CGO_ENABLED: 0
                  BUILD_TYPE: Release
                  OUTPUT_NAME: viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}
              run: |
                  just build Release

            - name: Package (Linux)
              if: ${{ matrix.target.goos == 'linux' }}
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf dist/package
                  mkdir -p dist/package
                  cp dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }} dist/package/viiper
                  cp dist/licenses.txt dist/package/licenses.txt
                  tar -czf dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.tar.gz -C dist/package viiper licenses.txt

            - name: Package (Windows)
              if: ${{ matrix.target.goos == 'windows' }}
              shell: pwsh
              run: |
                  Remove-Item -Recurse -Force dist/package -ErrorAction SilentlyContinue
                  New-Item -ItemType Directory -Force -Path dist/package | Out-Null
                  Copy-Item dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }} dist/package/viiper.exe -Force
                  Copy-Item dist/licenses.txt dist/package/licenses.txt -Force
                  Compress-Archive -Path dist/package/viiper.exe, dist/package/licenses.txt -DestinationPath dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.zip -Force

            - name: Upload artifact (Linux)
              if: ${{ inputs.upload_artifacts && matrix.target.goos == 'linux' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: VIIPER-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ inputs.artifact_suffix }}
                  path: dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.tar.gz
                  if-no-files-found: error

            - name: Upload artifact (Windows)
              if: ${{ inputs.upload_artifacts && matrix.target.goos == 'windows' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: VIIPER-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ inputs.artifact_suffix }}
                  path: dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.zip
                  if-no-files-found: error

    libviiper-linux:
        name: Build libVIIPER (linux/amd64)
        runs-on: ubuntu-24.04
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
              with:
                  just-version: "1.58.0"

            - name: Build
              run: |
                  just build-libVIIPER Release

            - name: Package
              run: cd dist/libVIIPER && zip libVIIPER-linux-amd64.zip libVIIPER.so libVIIPER.h licenses.txt

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: libVIIPER-linux-amd64${{ inputs.artifact_suffix }}
                  path: dist/libVIIPER/libVIIPER-linux-amd64.zip
                  if-no-files-found: error

    libviiper-windows:
        name: Build libVIIPER (windows/amd64)
        runs-on: windows-2025
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
              with:
                  go-version-file: go.mod
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
              with:
                  just-version: "1.58.0"

            - name: Install build tools
              shell: pwsh
              run: |
                  winget install -e --id MartinStorsjo.LLVM-MinGW.UCRT --accept-package-agreements --accept-source-agreements
                  winget install -e --id Kitware.CMake --accept-package-agreements --accept-source-agreements
                  if (Test-Path "C:\Program Files\LLVM-MinGW\bin") {
                    "C:\Program Files\LLVM-MinGW\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                  }
                  exit 0

            - name: Build
              shell: bash
              run: |
                  just build-libVIIPER Release

            - name: Package
              shell: pwsh
              run: |
                  Compress-Archive -Path dist/libVIIPER/libVIIPER.dll, dist/libVIIPER/libVIIPER.def, dist/libVIIPER/libVIIPER.h, dist/libVIIPER/licenses.txt -DestinationPath dist/libVIIPER/libVIIPER-windows-amd64.zip -Force

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: libVIIPER-windows-amd64${{ inputs.artifact_suffix }}
                  path: dist/libVIIPER/libVIIPER-windows-amd64.zip
                  if-no-files-found: error
