[package]
name = "viiper-auth-v2-validation"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
tokio = { version = "1.0", features = ["net", "io-util", "rt", "time", "macros"], optional = true }

[features]
default = []
async = ["tokio"]
