name: VIIPER Build Base

on:
    workflow_call:
        inputs:
            artifact_suffix:
                required: false
                type: string
                default: ""
                description: "Suffix to add to artifact names"
            upload_artifacts:
                required: false
                type: boolean
                default: false
                description: "Whether to upload build artifacts"

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: "1.27.0"
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Show Go version
              run: go version

            - name: Validate Windows installer first-run contract
              shell: pwsh
              run: |
                  $tokens = $null
                  $errors = $null
                  [Management.Automation.Language.Parser]::ParseFile(
                      (Resolve-Path "scripts/install.ps1"),
                      [ref]$tokens, [ref]$errors) | Out-Null
                  if ($errors.Count -ne 0) {
                      $errors | Format-List
                      throw "scripts/install.ps1 has PowerShell parser errors."
                  }
                  $source = Get-Content "scripts/install.ps1" -Raw
                  if ($source -match '(?m)^\s*\$runValue\s*=\s*Get-ItemPropertyValue') {
                      throw "VIIPER Run-value reads must tolerate a missing first-run property."
                  }
                  if ([regex]::Matches($source,
                          '(?m)^\s*\$runValue\s*=\s*Get-ViiperRunValue\s*$').Count -ne 2 -or
                      $source -notmatch 'RegistryValueOptions\]::DoNotExpandEnvironmentNames') {
                      throw "Both VIIPER startup verification paths must use the safe registry helper."
                  }
                  if ($source -notmatch 'function Get-OptionalRegistryValue' -or
                      $source -notmatch '\$null -eq \$key\) \{ return \$null \}') {
                      throw "The optional registry helper must treat a missing key as clean first-run state."
                  }
                  if ($source -notmatch 'VIIPER_DEVELOPER_STANDALONE' -or
                      $source -notmatch 'Global\\DS4Windows-VIIPER-Setup') {
                      throw "Windows standalone setup must be explicit and share the managed infrastructure mutex."
                  }

            - name: Lint
              uses: golangci/golangci-lint-action@v9.2.0
              with:
                  version: latest
                  install-mode: goinstall

            - name: Run tests
              run: just test-coverage

            - name: Run production Release-tag tests
              run: go test -tags release -count=1 ./...

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  directory: .
                  fail_ci_if_error: false

    test-windows:
        name: Test (Windows QPC)
        runs-on: windows-latest
        env:
            CGO_ENABLED: 0
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: "1.27.0"
                  cache: true
                  cache-dependency-path: |
                      go.sum

            # CFBK v1 uses cross-process Windows QPC, not a portable clock.
            # Run the entire suite here; do not filter out real Stop/ACK tests.
            - name: Run all tests with coverage
              run: go test -count=1 -v -coverpkg="./..." -coverprofile="coverage-windows.txt" ./...

            - name: Run production Release-tag tests
              run: go test -tags release -count=1 ./...

    build:
        name: Build binaries (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
        runs-on: ${{ matrix.target.runner }}
        needs: [test, test-windows]
        strategy:
            fail-fast: false
            matrix:
                target:
                    - { goos: linux, goarch: amd64, ext: "", runner: ubuntu-latest }
                    - { goos: linux, goarch: arm64, ext: "", runner: ubuntu-latest }
                    - { goos: windows, goarch: amd64, ext: ".exe", runner: windows-latest }
                    - { goos: windows, goarch: arm64, ext: ".exe", runner: windows-latest }
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Exercise Windows installer first-run registry states
              if: ${{ matrix.target.goos == 'windows' && matrix.target.goarch == 'amd64' }}
              shell: pwsh
              run: ./scripts/test-install-first-run.ps1

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: "1.27.0"
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Install goversioninfo
              shell: pwsh
              run: |
                  go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

            - name: Build
              shell: pwsh
              env:
                  GOOS: ${{ matrix.target.goos }}
                  GOARCH: ${{ matrix.target.goarch }}
                  CGO_ENABLED: 0
                  BUILD_TYPE: Release
                  OUTPUT_NAME: viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}
              run: |
                  $env:BUILD_DATE = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
                  "VIIPER_BUILD_DATE=$env:BUILD_DATE" >> $env:GITHUB_ENV
                  just build Release
                  if ($LASTEXITCODE -ne 0) { throw "Release build failed." }

            - name: Verify complete executable license notices
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $generated = Get-Content -LiteralPath dist/licenses.txt -Raw
                  $kongYaml = [regex]::Match($generated, '(?ms)^## github\.com/alecthomas/kong-yaml\r?\n.*?(?=^## |\z)').Value
                  if ($kongYaml -notmatch 'v0\.2\.1-0\.20240409173824-a56dc1466c79' -or
                      $kongYaml -notmatch 'Copyright \(C\) 2018 Alec Thomas' -or
                      $kongYaml -notmatch 'Permission is hereby granted, free of charge' -or
                      $kongYaml -notmatch 'THE SOFTWARE IS PROVIDED "AS IS"') {
                      throw 'Fresh dependency notices lack the pinned kong-yaml MIT grant.'
                  }
                  $apache = (Get-Content -LiteralPath internal/tray/systray/LICENSE -Raw).Replace("`r`n", "`n").Trim()
                  if (-not $generated.Replace("`r`n", "`n").Contains($apache)) {
                      throw 'Fresh dependency notices lack the complete copied systray license.'
                  }
                  $gpl = Get-Content -LiteralPath LICENSE.txt -Raw
                  if ($gpl -notmatch 'GNU GENERAL PUBLIC LICENSE' -or $gpl -notmatch 'END OF TERMS AND CONDITIONS') {
                      throw 'Complete VIIPER GPL license is missing.'
                  }
                  $notice = Get-Content -LiteralPath internal/tray/systray/README.viiper.md -Raw
                  if ($notice -notmatch '3266b44d2302c29b14a67b7f476fe0c1b05cb5b6' -or $notice -notmatch 'Minimal behavioral changes') {
                      throw 'The pinned systray modification notice is missing.'
                  }

            - name: Record verified Windows build provenance
              if: ${{ matrix.target.goos == 'windows' }}
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $binary = Get-Item 'dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}'
                  $sourceCommit = (git rev-parse HEAD).Trim()
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot identify source commit.' }
                  $version = (git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --always).Trim()
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot identify release version.' }
                  $goJson = & go version -m -json $binary.FullName
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot read embedded Go provenance.' }
                  $goInfo = ($goJson -join "`n") | ConvertFrom-Json
                  $settings = @{}
                  foreach ($setting in $goInfo.Settings) { $settings[$setting.Key] = $setting.Value }
                  if ($goInfo.GoVersion -ne 'go1.27.0' -or
                      $settings['vcs.revision'] -ne $sourceCommit -or
                      $settings['vcs.modified'] -ne 'false' -or
                      $settings['-tags'] -ne 'release' -or
                      $settings['-trimpath'] -ne 'true' -or
                      $settings['CGO_ENABLED'] -ne '0' -or
                      $settings['GOOS'] -ne 'windows' -or
                      $settings['GOARCH'] -ne '${{ matrix.target.goarch }}') {
                      throw 'Binary does not match the clean, pinned Release configuration.'
                  }
                  if ($binary.VersionInfo.ProductVersion -ne $version.TrimStart('v')) {
                      throw 'Embedded PE product version differs from the build tag.'
                  }
                  $help = $null
                  if ('${{ matrix.target.goarch }}' -eq 'amd64') {
                      $help = & $binary.FullName --help
                      if ($LASTEXITCODE -ne 0) { throw 'Binary help-only smoke check failed.' }
                  }
                  $licenses = @(
                      @{ Name = 'licenses.txt'; Source = 'dist/licenses.txt' },
                      @{ Name = 'LICENSE.txt'; Source = 'LICENSE.txt' },
                      @{ Name = 'VIIPER-SYSTRAY-NOTICE.md'; Source = 'internal/tray/systray/README.viiper.md' },
                      @{ Name = 'VIIPER-SYSTRAY-LICENSE.txt'; Source = 'internal/tray/systray/LICENSE' }
                  ) | ForEach-Object {
                      [ordered]@{ Name = $_.Name; Sha256 = (Get-FileHash -LiteralPath $_.Source -Algorithm SHA256).Hash }
                  }
                  [ordered]@{
                      SchemaVersion = 1
                      SourceCommit = $sourceCommit
                      Version = $version
                      ProductVersion = $binary.VersionInfo.ProductVersion
                      FileVersion = $binary.VersionInfo.FileVersion
                      BuildDate = $env:VIIPER_BUILD_DATE
                      GitHubRunId = $env:GITHUB_RUN_ID
                      GitHubRunAttempt = $env:GITHUB_RUN_ATTEMPT
                      Binary = [ordered]@{ Name = 'viiper.exe'; Size = $binary.Length; Sha256 = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash }
                      LicenseFiles = $licenses
                      GoBuildInfo = $goInfo
                      HelpOnlyOutput = $help
                  } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath dist/BUILD-INFO.json -Encoding utf8NoBOM
                  Get-Content -LiteralPath dist/BUILD-INFO.json

            - name: Package (Linux)
              if: ${{ matrix.target.goos == 'linux' }}
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf dist/package
                  mkdir -p dist/package
                  cp dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }} dist/package/viiper
                  cp dist/licenses.txt dist/package/licenses.txt
                  cp LICENSE.txt dist/package/LICENSE.txt
                  cp internal/tray/systray/README.viiper.md dist/package/VIIPER-SYSTRAY-NOTICE.md
                  cp internal/tray/systray/LICENSE dist/package/VIIPER-SYSTRAY-LICENSE.txt
                  tar -czf dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.tar.gz -C dist/package viiper licenses.txt LICENSE.txt VIIPER-SYSTRAY-NOTICE.md VIIPER-SYSTRAY-LICENSE.txt

            - name: Package (Windows)
              if: ${{ matrix.target.goos == 'windows' }}
              shell: pwsh
              run: |
                  Remove-Item -Recurse -Force dist/package -ErrorAction SilentlyContinue
                  New-Item -ItemType Directory -Force -Path dist/package | Out-Null
                  Copy-Item dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }} dist/package/viiper.exe -Force
                  Copy-Item dist/licenses.txt dist/package/licenses.txt -Force
                  Copy-Item LICENSE.txt dist/package/LICENSE.txt -Force
                  Copy-Item internal/tray/systray/README.viiper.md dist/package/VIIPER-SYSTRAY-NOTICE.md -Force
                  Copy-Item internal/tray/systray/LICENSE dist/package/VIIPER-SYSTRAY-LICENSE.txt -Force
                  Copy-Item dist/BUILD-INFO.json dist/package/BUILD-INFO.json -Force
                  Compress-Archive -Path dist/package/viiper.exe, dist/package/licenses.txt, dist/package/LICENSE.txt, dist/package/VIIPER-SYSTRAY-NOTICE.md, dist/package/VIIPER-SYSTRAY-LICENSE.txt, dist/package/BUILD-INFO.json -DestinationPath dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.zip -Force

            - name: Upload artifact (Linux)
              if: ${{ inputs.upload_artifacts && matrix.target.goos == 'linux' }}
              uses: actions/upload-artifact@v7
              with:
                  name: VIIPER-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ inputs.artifact_suffix }}
                  path: dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.tar.gz
                  if-no-files-found: error

            - name: Upload artifact (Windows)
              if: ${{ inputs.upload_artifacts && matrix.target.goos == 'windows' }}
              uses: actions/upload-artifact@v7
              with:
                  name: VIIPER-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ inputs.artifact_suffix }}
                  path: dist/viiper-${{ matrix.target.goos }}-${{ matrix.target.goarch }}.zip
                  if-no-files-found: error

    libviiper-linux:
        name: Build libVIIPER (linux/amd64)
        runs-on: ubuntu-latest
        needs: [test, test-windows]
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: "1.27.0"
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Build
              run: |
                  just build-libVIIPER Release

            - name: Package
              run: |
                  cp LICENSE.txt dist/libVIIPER/LICENSE.txt
                  cp internal/tray/systray/README.viiper.md dist/libVIIPER/VIIPER-SYSTRAY-NOTICE.md
                  cp internal/tray/systray/LICENSE dist/libVIIPER/VIIPER-SYSTRAY-LICENSE.txt
                  cd dist/libVIIPER && zip libVIIPER-linux-amd64.zip libVIIPER.so libVIIPER.h licenses.txt LICENSE.txt VIIPER-SYSTRAY-NOTICE.md VIIPER-SYSTRAY-LICENSE.txt

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@v7
              with:
                  name: libVIIPER-linux-amd64${{ inputs.artifact_suffix }}
                  path: dist/libVIIPER/libVIIPER-linux-amd64.zip
                  if-no-files-found: error

    libviiper-windows:
        name: Build libVIIPER (windows/amd64)
        runs-on: windows-latest
        needs: [test, test-windows]
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version: "1.27.0"
                  cache: true
                  cache-dependency-path: |
                      go.sum

            - name: Setup just
              uses: extractions/setup-just@v3

            - name: Install build tools
              shell: pwsh
              run: |
                  winget install -e --id MartinStorsjo.LLVM-MinGW.UCRT --accept-package-agreements --accept-source-agreements
                  winget install -e --id Kitware.CMake --accept-package-agreements --accept-source-agreements
                  if (Test-Path "C:\Program Files\LLVM-MinGW\bin") {
                    "C:\Program Files\LLVM-MinGW\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                  }
                  exit 0

            - name: Build
              shell: bash
              run: |
                  just build-libVIIPER Release

            - name: Package
              shell: pwsh
              run: |
                  Copy-Item LICENSE.txt dist/libVIIPER/LICENSE.txt -Force
                  Copy-Item internal/tray/systray/README.viiper.md dist/libVIIPER/VIIPER-SYSTRAY-NOTICE.md -Force
                  Copy-Item internal/tray/systray/LICENSE dist/libVIIPER/VIIPER-SYSTRAY-LICENSE.txt -Force
                  Compress-Archive -Path dist/libVIIPER/libVIIPER.dll, dist/libVIIPER/libVIIPER.def, dist/libVIIPER/libVIIPER.h, dist/libVIIPER/licenses.txt, dist/libVIIPER/LICENSE.txt, dist/libVIIPER/VIIPER-SYSTRAY-NOTICE.md, dist/libVIIPER/VIIPER-SYSTRAY-LICENSE.txt -DestinationPath dist/libVIIPER/libVIIPER-windows-amd64.zip -Force

            - name: Upload artifact
              if: ${{ inputs.upload_artifacts }}
              uses: actions/upload-artifact@v7
              with:
                  name: libVIIPER-windows-amd64${{ inputs.artifact_suffix }}
                  path: dist/libVIIPER/libVIIPER-windows-amd64.zip
                  if-no-files-found: error
